name: Job Ingestion Pipeline

on:
  schedule:
    # GitHub Actions cron runs in UTC: once every week.
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion pipeline
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MAX_PAGES_PER_QUERY: ${{ secrets.MAX_PAGES_PER_QUERY }}
          REQUEST_DELAY_SECONDS: ${{ secrets.REQUEST_DELAY_SECONDS }}
        run: python healthcare_job_ingestion_mongodb.py
